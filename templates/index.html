<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Video & Audio Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 2.2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 540px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 0.4rem;
            font-size: 1.6rem;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1.6rem;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 13px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #27ae60;
        }
        .btn-check {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-check:hover {
            background-color: #2c3e50;
        }
        #previewBox {
            display: none;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 1.2rem;
            text-align: left;
            align-items: center;
            gap: 14px;
        }
        #previewBox.show {
            display: flex;
        }
        #thumbImg {
            width: 140px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
            flex-shrink: 0;
        }
        .video-meta {
            overflow: hidden;
        }
        .video-title {
            font-weight: bold;
            color: #1e293b;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-sub {
            font-size: 0.8rem;
            color: #64748b;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        select {
            padding: 13px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
            color: #2c3e50;
        }
        .btn-download {
            flex: 1;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #219150;
        }
        #status {
            margin-top: 1.1rem;
            font-size: 0.9rem;
            color: #2980b9;
            display: none;
        }
        #errorMsg {
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #e74c3c;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Video & Audio Downloader</h1>
        <p class="subtitle">วางลิงก์วิดีโอเพื่อพรีวิวและเลือกความละเอียดที่ต้องการ</p>
        
        <form id="dlForm" action="/download" method="POST">
            <div class="input-group">
                <input type="text" name="url" id="urlInput" placeholder="วางลิงก์วิดีโอที่นี่..." required>
                <button type="button" class="btn-check" id="checkBtn">ตรวจสอบ</button>
            </div>

            <div id="errorMsg"></div>

            <div id="previewBox">
                <img id="thumbImg" src="" alt="Thumbnail">
                <div class="video-meta">
                    <div class="video-title" id="videoTitle">ชื่อคลิป</div>
                    <div class="video-sub" id="videoSub">ช่อง • ความยาว</div>
                </div>
            </div>

            <div class="controls">
                <select name="quality">
                    <optgroup label="วิดีโอ (MP4)">
                        <option value="best">MP4 - สูงสุดเท่าที่มี</option>
                        <option value="1080" selected>MP4 - 1080p (Full HD)</option>
                        <option value="720">MP4 - 720p (HD)</option>
                        <option value="480">MP4 - 480p</option>
                    </optgroup>
                    <optgroup label="เสียงอย่างเดียว (MP3)">
                        <option value="mp3_320">MP3 - 320 kbps (ชัดสุด)</option>
                        <option value="mp3_192">MP3 - 192 kbps (มาตรฐาน)</option>
                        <option value="mp3_128">MP3 - 128 kbps (ไฟล์เล็ก)</option>
                    </optgroup>
                </select>
                <button type="submit" class="btn-download" id="submitBtn">ดาวน์โหลด</button>
            </div>
        </form>
        <div id="status">กำลังดึงข้อมูลและแปลงไฟล์ กรุณารอสักครู่...</div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const checkBtn = document.getElementById('checkBtn');
        const previewBox = document.getElementById('previewBox');
        const thumbImg = document.getElementById('thumbImg');
        const videoTitle = document.getElementById('videoTitle');
        const videoSub = document.getElementById('videoSub');
        const errorMsg = document.getElementById('errorMsg');
        const form = document.getElementById('dlForm');
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');

        let lastCheckedUrl = '';

        async function fetchPreview() {
            const url = urlInput.value.trim();
            if (!url || url === lastCheckedUrl) return;
            
            lastCheckedUrl = url;
            errorMsg.style.display = 'none';
            previewBox.classList.remove('show');
            checkBtn.textContent = 'กำลังค้นหา...';
            checkBtn.disabled = true;

            try {
                const res = await fetch('/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'เกิดข้อผิดพลาด');
                }

                thumbImg.src = data.thumbnail;
                videoTitle.textContent = data.title;
                videoSub.textContent = `${data.uploader} • ความยาว ${data.duration}`;
                previewBox.classList.add('show');
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                lastCheckedUrl = '';
            } finally {
                checkBtn.textContent = 'ตรวจสอบ';
                checkBtn.disabled = false;
            }
        }

        urlInput.addEventListener('paste', () => {
            setTimeout(fetchPreview, 100);
        });

        checkBtn.addEventListener('click', fetchPreview);

        form.addEventListener('submit', () => {
            status.style.display = 'block';
            btn.textContent = 'กำลังประมวลผล...';
            setTimeout(() => {
                btn.textContent = 'ดาวน์โหลด';
                status.style.display = 'none';
            }, 8000);
        });
    </script>
</body>
</html>
